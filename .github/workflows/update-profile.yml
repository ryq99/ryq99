name: Update kb_ index

# Refreshes the PRIVATE kb_ workspace index in ryq99/kb_index daily.
# The public profile (github.com/ryq99) just links to that repo — nothing to generate there.
#
# Requires a repo secret PROFILE_TOKEN: a PAT (classic: `repo` scope, or
# fine-grained with Contents:read/write on ryq99/* and access to all repos).
# The built-in GITHUB_TOKEN can't list your private repos or push to kb_index.

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch:       # manual "Run workflow" button

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repo
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- Private kb_ workspace index (in ryq99/kb_index) ----
      - name: Check out kb_index repo
        uses: actions/checkout@v4
        with:
          repository: ryq99/kb_index
          token: ${{ secrets.PROFILE_TOKEN }}
          path: kb_index

      - name: Regenerate kb_ index
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          python update_repo_profile.py \
            --user ryq99 --readme kb_index/README.md --visibility private \
            --include-prefixes kb_ --exclude-names kb_index \
            --show-updated --sort-by updated

      - name: Commit kb_ index if changed
        working-directory: kb_index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: refresh kb_ workspace index [skip ci]"
            git push
          else
            echo "kb_index README unchanged."
          fi
