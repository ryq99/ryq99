name: Generate snake

# Renders the ryq99 contribution graph as a "snake eating the squares"
# animation and publishes the SVGs to the `output` branch, which README.md
# embeds. Uses the built-in GITHUB_TOKEN — no PAT needed.

on:
  schedule:
    - cron: "0 */12 * * *"   # twice daily
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
